# Blueprint de Render: un servicio web Node con disco persistente para la base SQLite.
services:
  - type: web
    name: channel-challenge
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /var/data/channel-challenge.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
